<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
      
    <rect width="100%" height="100%" fill="#111827" rx="14"/>
    <rect width="100%" height="48" fill="#1E293B" rx="14"/>
    <rect y="36" width="100%" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>
    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Arquitetura de Dados em Nuvem | Google Tag Manager Server-Side (sGTM)</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#2563EB" opacity="0.2"/>
    <text x="905" y="29" fill="#2563EB" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SERVIDORES EM NUVEM</text>
  
      
      <!-- Client Device -->
      <rect x="50" y="160" width="220" height="260" rx="10" fill="#1E293B" stroke="#38BDF8"/>
      <text x="160" y="200" fill="#38BDF8" font-family="Sora" font-size="15" font-weight="700" text-anchor="middle">Navegador do Cliente</text>
      <text x="70" y="235" fill="#94A3B8" font-family="Inter" font-size="11">&#8226; Dispara apenas 1 script leve</text>
      <text x="70" y="260" fill="#94A3B8" font-family="Inter" font-size="11">&#8226; Carregamento rápido 1.2s</text>
      <text x="70" y="285" fill="#94A3B8" font-family="Inter" font-size="11">&#8226; Imune a ad blockers</text>
      <rect x="70" y="320" width="180" height="60" rx="4" fill="#0F172A"/>
      <text x="160" y="345" fill="#10B981" font-family="JetBrains Mono" font-size="10" text-anchor="middle">POST dados.seusite.com.br</text>
      <text x="160" y="365" fill="#94A3B8" font-family="Inter" font-size="10" text-anchor="middle">Subdomínio Próprio</text>

      <!-- Arrow -->
      <path d="M 280 290 L 380 290" stroke="#38BDF8" stroke-width="4" fill="none"/>

      <!-- sGTM Server Cloud -->
      <rect x="390" y="110" width="260" height="360" rx="10" fill="#0F172A" stroke="#2563EB" stroke-width="2"/>
      <text x="520" y="150" fill="#38BDF8" font-family="Sora" font-size="16" font-weight="800" text-anchor="middle">&#9729; Servidor sGTM (Cloud)</text>
      <text x="520" y="175" fill="#94A3B8" font-family="Inter" font-size="11" text-anchor="middle">Stape.io / Google Cloud Run</text>

      <rect x="410" y="200" width="220" height="60" rx="6" fill="#1E293B"/>
      <text x="520" y="225" fill="#10B981" font-family="Inter" font-size="12" font-weight="700" text-anchor="middle">&#10003; Criptografia SHA-256</text>
      <text x="520" y="245" fill="#94A3B8" font-family="Inter" font-size="10" text-anchor="middle">Higienização de dados pessoais</text>

      <rect x="410" y="275" width="220" height="60" rx="6" fill="#1E293B"/>
      <text x="520" y="300" fill="#F97316" font-family="Inter" font-size="12" font-weight="700" text-anchor="middle">&#10003; Extensão de Cookies (ITP)</text>
      <text x="520" y="320" fill="#94A3B8" font-family="Inter" font-size="10" text-anchor="middle">Cookies do Safari retidos por 90d</text>

      <rect x="410" y="350" width="220" height="60" rx="6" fill="#1E293B"/>
      <text x="520" y="375" fill="#38BDF8" font-family="Inter" font-size="12" font-weight="700" text-anchor="middle">&#10003; Filtro LGPD / GDPR</text>
      <text x="520" y="395" fill="#94A3B8" font-family="Inter" font-size="10" text-anchor="middle">Controle de consentimento</text>

      <!-- Outputs -->
      <path d="M 660 220 L 760 160" stroke="#10B981" stroke-width="2" fill="none"/>
      <path d="M 660 290 L 760 290" stroke="#F97316" stroke-width="2" fill="none"/>
      <path d="M 660 360 L 760 420" stroke="#38BDF8" stroke-width="2" fill="none"/>

      <rect x="770" y="120" width="180" height="70" rx="6" fill="#1E293B" stroke="#10B981"/>
      <text x="860" y="150" fill="#10B981" font-family="Sora" font-size="13" font-weight="700" text-anchor="middle">Meta CAPI</text>
      <text x="860" y="172" fill="#94A3B8" font-family="Inter" font-size="10" text-anchor="middle">EMQ 9.2 (Excelente)</text>

      <rect x="770" y="255" width="180" height="70" rx="6" fill="#1E293B" stroke="#F97316"/>
      <text x="860" y="285" fill="#F97316" font-family="Sora" font-size="13" font-weight="700" text-anchor="middle">Google Analytics 4</text>
      <text x="860" y="307" fill="#94A3B8" font-family="Inter" font-size="10" text-anchor="middle">Receita 100% precisa</text>

      <rect x="770" y="390" width="180" height="70" rx="6" fill="#1E293B" stroke="#38BDF8"/>
      <text x="860" y="420" fill="#38BDF8" font-family="Sora" font-size="13" font-weight="700" text-anchor="middle">TikTok Events API</text>
      <text x="860" y="442" fill="#94A3B8" font-family="Inter" font-size="10" text-anchor="middle">Conversão em tempo real</text>
    </svg>