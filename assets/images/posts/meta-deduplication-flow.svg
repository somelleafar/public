<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
      
    <rect width="100%" height="100%" fill="#111827" rx="14"/>
    <rect width="100%" height="48" fill="#1E293B" rx="14"/>
    <rect y="36" width="100%" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>
    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Arquitetura de Deduplicação de Eventos Híbrida (Meta Ads)</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#2563EB" opacity="0.2"/>
    <text x="905" y="29" fill="#2563EB" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FLUXO SERVER-SIDE</text>
  
      
      <!-- Browser Node -->
      <rect x="50" y="100" width="260" height="170" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
      <text x="180" y="135" fill="#38BDF8" font-family="Sora" font-size="16" font-weight="700" text-anchor="middle">Navegador (Pixel Web)</text>
      <text x="70" y="170" fill="#F8FAFC" font-family="JetBrains Mono" font-size="12">event: "Purchase"</text>
      <text x="70" y="195" fill="#F8FAFC" font-family="JetBrains Mono" font-size="12">event_id: "PED_987654"</text>
      <text x="70" y="220" fill="#F8FAFC" font-family="JetBrains Mono" font-size="12">value: 297.00 BRL</text>
      <rect x="70" y="235" width="130" height="20" rx="4" fill="#0284C7" opacity="0.3"/>
      <text x="135" y="249" fill="#38BDF8" font-family="Inter" font-size="10" font-weight="700" text-anchor="middle">Via Client-Side</text>
      
      <!-- Server Node -->
      <rect x="50" y="320" width="260" height="170" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
      <text x="180" y="355" fill="#10B981" font-family="Sora" font-size="16" font-weight="700" text-anchor="middle">Servidor (Meta CAPI)</text>
      <text x="70" y="390" fill="#F8FAFC" font-family="JetBrains Mono" font-size="12">event: "Purchase"</text>
      <text x="70" y="415" fill="#F8FAFC" font-family="JetBrains Mono" font-size="12">event_id: "PED_987654"</text>
      <text x="70" y="440" fill="#F8FAFC" font-family="JetBrains Mono" font-size="12">user_data: { em, ph, fbp }</text>
      <rect x="70" y="455" width="130" height="20" rx="4" fill="#059669" opacity="0.3"/>
      <text x="135" y="469" fill="#10B981" font-family="Inter" font-size="10" font-weight="700" text-anchor="middle">Via Server-Side</text>
      
      <!-- Arrows -->
      <path d="M 320 185 L 580 270" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,6" fill="none"/>
      <path d="M 320 405 L 580 310" stroke="#10B981" stroke-width="3" fill="none"/>
      
      <!-- Meta Engine Node -->
      <rect x="590" y="160" width="360" height="260" rx="14" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
      <rect x="610" y="185" width="160" height="28" rx="6" fill="#F97316" opacity="0.2"/>
      <text x="690" y="204" fill="#F97316" font-family="Sora" font-size="13" font-weight="700" text-anchor="middle">Motor Meta Ads</text>
      <text x="610" y="245" fill="#F8FAFC" font-family="Sora" font-size="18" font-weight="700">Deduplicação de Eventos</text>
      <text x="610" y="275" fill="#94A3B8" font-family="Inter" font-size="13">O algoritmo reconhece o mesmo event_id:</text>
      
      <rect x="610" y="295" width="320" height="50" rx="6" fill="#090D16" stroke="#10B981"/>
      <text x="630" y="325" fill="#10B981" font-family="Inter" font-size="14" font-weight="700">&#10003; 1 Conversão Consolidada</text>
      
      <text x="610" y="375" fill="#94A3B8" font-family="Inter" font-size="12">Segunda requisição descartada automaticamente.</text>
      <text x="610" y="395" fill="#38BDF8" font-family="Inter" font-size="12">Atribuição perfeita sem duplicar faturamento.</text>
    </svg>