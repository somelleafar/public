<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
      
    <rect width="100%" height="100%" fill="#111827" rx="14"/>
    <rect width="100%" height="48" fill="#1E293B" rx="14"/>
    <rect y="36" width="100%" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>
    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Landing Page Mobile Local | Otimizada para WhatsApp e Carregamento Rápido</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#10B981" opacity="0.2"/>
    <text x="905" y="29" fill="#10B981" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CRO 18.5% TAXA</text>
  
      
      <!-- Mobile Mockup Screen -->
      <rect x="320" y="70" width="360" height="470" rx="20" fill="#F8F7F4" stroke="#334155" stroke-width="4"/>
      
      <!-- Top Bar -->
      <rect x="340" y="90" width="320" height="30" rx="6" fill="#111827"/>
      <text x="355" y="110" fill="#F8FAFC" font-family="Sora" font-size="11" font-weight="700">Clínica Odontológica Paulista</text>
      <circle cx="640" cy="105" r="4" fill="#10B981"/>

      <!-- Hero Headline -->
      <text x="345" y="145" fill="#111827" font-family="Sora" font-size="15" font-weight="800">Recupere seu Sorriso</text>
      <text x="345" y="165" fill="#111827" font-family="Sora" font-size="15" font-weight="800">em São Paulo com Conforto</text>
      <text x="345" y="185" fill="#4B5563" font-family="Inter" font-size="10">Atendimento humanizado na Av. Paulista com horário flexível.</text>

      <!-- Trust Badges -->
      <rect x="345" y="200" width="110" height="18" rx="9" fill="#2563EB" opacity="0.15"/>
      <text x="400" y="213" fill="#2563EB" font-family="Inter" font-size="9" font-weight="700" text-anchor="middle">★ Nota 4.9 (420 avaliações)</text>

      <!-- Photo Card Mockup -->
      <rect x="345" y="230" width="310" height="110" rx="8" fill="#E2E8F0"/>
      <text x="500" y="290" fill="#64748B" font-family="Inter" font-size="12" text-anchor="middle">[Foto Real da Equipe e Fachada]</text>

      <!-- Floating WhatsApp Button -->
      <rect x="345" y="360" width="310" height="46" rx="8" fill="#10B981"/>
      <text x="500" y="388" fill="#FFFFFF" font-family="Sora" font-size="13" font-weight="700" text-anchor="middle">&#128172; Agendar Consulta pelo WhatsApp</text>
      
      <text x="500" y="425" fill="#6B7280" font-family="Inter" font-size="9" text-anchor="middle">Tempo de resposta médio: menos de 3 minutos</text>

      <!-- Left Callout Box -->
      <rect x="40" y="120" width="240" height="130" rx="8" fill="#1E293B"/>
      <text x="60" y="150" fill="#38BDF8" font-family="Sora" font-size="14" font-weight="700">Velocidade 1.4s</text>
      <text x="60" y="175" fill="#94A3B8" font-family="Inter" font-size="11">Página ultraleve sem plugins pesados. Nota 96 no Google PageSpeed.</text>

      <!-- Right Callout Box -->
      <rect x="720" y="120" width="240" height="130" rx="8" fill="#1E293B"/>
      <text x="740" y="150" fill="#F97316" font-family="Sora" font-size="14" font-weight="700">Filtro de Objeção</text>
      <text x="740" y="175" fill="#94A3B8" font-family="Inter" font-size="11">Endereço, estacionamento e preços médios visíveis para qualificar o lead.</text>
    </svg>