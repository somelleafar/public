<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
      
    <rect width="100%" height="100%" fill="#111827" rx="14"/>
    <rect width="100%" height="48" fill="#1E293B" rx="14"/>
    <rect y="36" width="100%" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>
    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Dashboard Financeiro de Mídia Paga | Visão Consolidada de Retorno Real</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#2563EB" opacity="0.2"/>
    <text x="905" y="29" fill="#2563EB" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">DADOS CONSOLIDADOS</text>
  
      
      <!-- Metric Card 1: CPA Blend -->
      <rect x="50" y="80" width="200" height="150" rx="8" fill="#1E293B"/>
      <text x="75" y="115" fill="#94A3B8" font-family="Inter" font-size="11" font-weight="700" text-transform="uppercase">CPA Blend Real</text>
      <text x="75" y="160" fill="#F8FAFC" font-family="Sora" font-size="30" font-weight="800">R$ 34,20</text>
      <text x="75" y="195" fill="#10B981" font-family="Inter" font-size="11" font-weight="700">&#8595; -18% vs mês anterior</text>

      <!-- Metric Card 2: ROAS Global -->
      <rect x="280" y="80" width="200" height="150" rx="8" fill="#1E293B"/>
      <text x="305" y="115" fill="#94A3B8" font-family="Inter" font-size="11" font-weight="700" text-transform="uppercase">ROAS Global</text>
      <text x="305" y="160" fill="#10B981" font-family="Sora" font-size="30" font-weight="800">4.62x</text>
      <text x="305" y="195" fill="#10B981" font-family="Inter" font-size="11" font-weight="700">Meta: 3.5x (+32% acima)</text>

      <!-- Metric Card 3: Taxa de Conversão -->
      <rect x="510" y="80" width="200" height="150" rx="8" fill="#1E293B"/>
      <text x="535" y="115" fill="#94A3B8" font-family="Inter" font-size="11" font-weight="700" text-transform="uppercase">Taxa de Conversão (CVR)</text>
      <text x="535" y="160" fill="#38BDF8" font-family="Sora" font-size="30" font-weight="800">3.24%</text>
      <text x="535" y="195" fill="#38BDF8" font-family="Inter" font-size="11" font-weight="700">Média de mercado: 1.8%</text>

      <!-- Metric Card 4: Payback -->
      <rect x="740" y="80" width="200" height="150" rx="8" fill="#1E293B"/>
      <text x="765" y="115" fill="#94A3B8" font-family="Inter" font-size="11" font-weight="700" text-transform="uppercase">Tempo de Payback</text>
      <text x="765" y="160" fill="#F97316" font-family="Sora" font-size="30" font-weight="800">14 Dias</text>
      <text x="765" y="195" fill="#10B981" font-family="Inter" font-size="11" font-weight="700">Recuperação rápida de caixa</text>

      <!-- Chart Simulation Bottom -->
      <rect x="50" y="260" width="890" height="250" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="80" y="300" fill="#F8FAFC" font-family="Sora" font-size="16" font-weight="700">Evolução de Investimento em Mídia vs. Faturamento Líquido</text>
      
      <!-- Bars -->
      <rect x="120" y="380" width="40" height="90" fill="#2563EB"/>
      <rect x="170" y="330" width="40" height="140" fill="#10B981"/>
      <text x="165" y="490" fill="#94A3B8" font-family="Inter" font-size="11" text-anchor="middle">Semana 1</text>

      <rect x="320" y="360" width="40" height="110" fill="#2563EB"/>
      <rect x="370" y="300" width="40" height="170" fill="#10B981"/>
      <text x="365" y="490" fill="#94A3B8" font-family="Inter" font-size="11" text-anchor="middle">Semana 2</text>

      <rect x="520" y="340" width="40" height="130" fill="#2563EB"/>
      <rect x="570" y="260" width="40" height="210" fill="#10B981"/>
      <text x="565" y="490" fill="#94A3B8" font-family="Inter" font-size="11" text-anchor="middle">Semana 3</text>

      <rect x="720" y="320" width="40" height="150" fill="#2563EB"/>
      <rect x="770" y="210" width="40" height="260" fill="#10B981"/>
      <text x="765" y="490" fill="#94A3B8" font-family="Inter" font-size="11" text-anchor="middle">Semana 4</text>
    </svg>