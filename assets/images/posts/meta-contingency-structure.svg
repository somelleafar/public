<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
      
    <rect width="100%" height="100%" fill="#111827" rx="14"/>
    <rect width="100%" height="48" fill="#1E293B" rx="14"/>
    <rect y="36" width="100%" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>
    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Estrutura de Contingência Blindada no Meta Ads</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#10B981" opacity="0.2"/>
    <text x="905" y="29" fill="#10B981" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SEGURANÇA TOTAL</text>
  
      
      <!-- Admins -->
      <rect x="60" y="80" width="260" height="85" rx="8" fill="#1E293B" stroke="#38BDF8"/>
      <text x="190" y="115" fill="#38BDF8" font-family="Sora" font-size="14" font-weight="700" text-anchor="middle">Perfil Admin 1 (Titular)</text>
      <text x="190" y="145" fill="#10B981" font-family="Inter" font-size="11" font-weight="700" text-anchor="middle">&#10003; 2FA Ativado + Identidade Verificada</text>

      <rect x="680" y="80" width="260" height="85" rx="8" fill="#1E293B" stroke="#38BDF8"/>
      <text x="810" y="115" fill="#38BDF8" font-family="Sora" font-size="14" font-weight="700" text-anchor="middle">Perfil Admin 2 (Backup)</text>
      <text x="810" y="145" fill="#10B981" font-family="Inter" font-size="11" font-weight="700" text-anchor="middle">&#10003; 2FA Ativado + Identidade Verificada</text>

      <!-- Connectors to Vault -->
      <path d="M 190 165 L 500 220" stroke="#38BDF8" stroke-width="2" fill="none"/>
      <path d="M 810 165 L 500 220" stroke="#38BDF8" stroke-width="2" fill="none"/>

      <!-- BM Vault -->
      <rect x="330" y="220" width="340" height="110" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
      <text x="500" y="255" fill="#10B981" font-family="Sora" font-size="16" font-weight="800" text-anchor="middle">&#128274; BM Cofre (Matriz)</text>
      <text x="500" y="280" fill="#F8FAFC" font-family="Inter" font-size="12" text-anchor="middle">Guarda o Pixel Principal e Domínio Verificado</text>
      <text x="500" y="305" fill="#EF4444" font-family="Inter" font-size="11" font-weight="700" text-anchor="middle">&#10007; Nunca cadastra cartão e não roda anúncios</text>

      <!-- Arrow down to Operational BM -->
      <path d="M 500 330 L 500 390" stroke="#F97316" stroke-width="3" fill="none"/>
      <text x="520" y="365" fill="#F97316" font-family="Inter" font-size="11" font-weight="700">Compartilha Pixel</text>

      <!-- Operational BM -->
      <rect x="180" y="390" width="640" height="130" rx="10" fill="#1E293B" stroke="#F97316"/>
      <text x="500" y="425" fill="#F97316" font-family="Sora" font-size="15" font-weight="700" text-anchor="middle">BM Operacional (Anunciante)</text>
      <text x="500" y="450" fill="#94A3B8" font-family="Inter" font-size="12" text-anchor="middle">Contas de Anúncios com Cartões Virtuais Separados (Conta 1 e Conta 2 Reserva)</text>
      <text x="500" y="485" fill="#10B981" font-family="Inter" font-size="12" font-weight="700" text-anchor="middle">&#10003; Se o BM Operacional sofrer restrição, o Pixel e os dados continuam intactos no Cofre.</text>
    </svg>