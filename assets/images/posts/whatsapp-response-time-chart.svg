<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
      
    <rect width="100%" height="100%" fill="#111827" rx="14"/>
    <rect width="100%" height="48" fill="#1E293B" rx="14"/>
    <rect y="36" width="100%" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>
    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Impacto do Tempo de Resposta no Fechamento de Vendas pelo WhatsApp</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#EF4444" opacity="0.2"/>
    <text x="905" y="29" fill="#EF4444" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SLA DE ATENDIMENTO</text>
  
      
      <rect x="60" y="80" width="880" height="440" rx="10" fill="#1E293B"/>
      
      <!-- Axis Lines -->
      <path d="M 120 440 L 880 440" stroke="#64748B" stroke-width="2"/>
      <path d="M 120 440 L 120 120" stroke="#64748B" stroke-width="2"/>
      <text x="880" y="470" fill="#94A3B8" font-family="Inter" font-size="12" text-anchor="end">Tempo para Primeira Resposta Comercial</text>
      <text x="110" y="115" fill="#94A3B8" font-family="Inter" font-size="12" text-anchor="end">Taxa de Conversão em Venda (%)</text>

      <!-- Conversion Rate Falling -->
      <path d="M 120 150 Q 250 200 450 360 T 860 420" stroke="#10B981" stroke-width="4" fill="none"/>
      
      <!-- Point 1: < 5 min -->
      <circle cx="160" cy="170" r="10" fill="#10B981"/>
      <rect x="130" y="105" width="130" height="45" rx="6" fill="#0F172A" stroke="#10B981"/>
      <text x="195" y="125" fill="#10B981" font-family="Sora" font-size="14" font-weight="800" text-anchor="middle">68% Fecham</text>
      <text x="195" y="142" fill="#94A3B8" font-family="Inter" font-size="10" text-anchor="middle">&lt; 5 minutos</text>

      <!-- Point 2: 15 min -->
      <circle cx="340" cy="270" r="8" fill="#F59E0B"/>
      <rect x="310" y="210" width="130" height="45" rx="6" fill="#0F172A" stroke="#F59E0B"/>
      <text x="375" y="230" fill="#F59E0B" font-family="Sora" font-size="14" font-weight="800" text-anchor="middle">32% Fecham</text>
      <text x="375" y="247" fill="#94A3B8" font-family="Inter" font-size="10" text-anchor="middle">15 a 30 minutos</text>

      <!-- Point 3: > 1 hour -->
      <circle cx="600" cy="390" r="8" fill="#EF4444"/>
      <rect x="570" y="330" width="130" height="45" rx="6" fill="#0F172A" stroke="#EF4444"/>
      <text x="635" y="350" fill="#EF4444" font-family="Sora" font-size="14" font-weight="800" text-anchor="middle">9% Fecham</text>
      <text x="635" y="367" fill="#94A3B8" font-family="Inter" font-size="10" text-anchor="middle">&gt; 1 a 2 horas</text>

      <!-- Point 4: > 6 hours -->
      <circle cx="820" cy="420" r="8" fill="#EF4444"/>
      <rect x="760" y="360" width="130" height="45" rx="6" fill="#0F172A" stroke="#EF4444"/>
      <text x="825" y="380" fill="#EF4444" font-family="Sora" font-size="14" font-weight="800" text-anchor="middle">&lt; 2% Fecham</text>
      <text x="825" y="397" fill="#94A3B8" font-family="Inter" font-size="10" text-anchor="middle">&gt; 6 horas (Perdido)</text>

      <text x="500" y="505" fill="#EF4444" font-family="Inter" font-size="13" font-weight="700" text-anchor="middle">&#9888; Cada minuto de atraso no atendimento do WhatsApp custa vendas reais para o concorrente.</text>
    </svg>