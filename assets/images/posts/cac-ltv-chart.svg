<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
      
    <rect width="100%" height="100%" fill="#111827" rx="14"/>
    <rect width="100%" height="48" fill="#1E293B" rx="14"/>
    <rect y="36" width="100%" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>
    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Análise de Viabilidade Financeira | Relação LTV / CAC</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#10B981" opacity="0.2"/>
    <text x="905" y="29" fill="#10B981" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">LTV/CAC = 5.6x</text>
  
      
      <!-- CAC Bar -->
      <rect x="140" y="100" width="280" height="360" rx="10" fill="#1E293B"/>
      <text x="280" y="140" fill="#EF4444" font-family="Sora" font-size="18" font-weight="800" text-anchor="middle">CAC (Custo de Aquisição)</text>
      
      <rect x="200" y="280" width="160" height="140" rx="8" fill="#EF4444"/>
      <text x="280" y="350" fill="#FFFFFF" font-family="Sora" font-size="28" font-weight="800" text-anchor="middle">R$ 120</text>
      
      <text x="280" y="200" fill="#94A3B8" font-family="Inter" font-size="12" text-anchor="middle">Mídia Paga + Time Comercial</text>
      <text x="280" y="225" fill="#94A3B8" font-family="Inter" font-size="12" text-anchor="middle">gasto para trazer 1 novo cliente</text>

      <!-- LTV Bar -->
      <rect x="580" y="100" width="280" height="360" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
      <text x="720" y="140" fill="#10B981" font-family="Sora" font-size="18" font-weight="800" text-anchor="middle">LTV (Lifetime Value)</text>
      
      <rect x="640" y="170" width="160" height="250" rx="8" fill="#10B981"/>
      <text x="720" y="300" fill="#FFFFFF" font-family="Sora" font-size="28" font-weight="800" text-anchor="middle">R$ 680</text>
      
      <text x="720" y="200" fill="#FFFFFF" font-family="Inter" font-size="12" text-anchor="middle">Receita Média por Cliente</text>
      <text x="720" y="225" fill="#FFFFFF" font-family="Inter" font-size="12" text-anchor="middle">ao longo de 12 meses de relação</text>

      <!-- Multiplier Badge -->
      <circle cx="500" cy="300" r="45" fill="#0F172A" stroke="#10B981" stroke-width="3"/>
      <text x="500" y="295" fill="#10B981" font-family="Sora" font-size="20" font-weight="800" text-anchor="middle">5.6x</text>
      <text x="500" y="315" fill="#38BDF8" font-family="Inter" font-size="10" font-weight="700" text-anchor="middle">LTV / CAC</text>

      <rect x="140" y="480" width="720" height="40" rx="6" fill="#0F172A"/>
      <text x="500" y="505" fill="#10B981" font-family="Inter" font-size="13" font-weight="700" text-anchor="middle">&#10003; Relação acima de 3:1 confirma saúde financeira e segurança total para acelerar investimentos em anúncios.</text>
    </svg>