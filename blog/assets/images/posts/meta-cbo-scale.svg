<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
      
    <rect width="100%" height="100%" fill="#111827" rx="14"/>
    <rect width="100%" height="48" fill="#1E293B" rx="14"/>
    <rect y="36" width="100%" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>
    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Estrutura de Escala em CBO (Advantage+ Budget) | Otimização Dinâmica</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#F97316" opacity="0.2"/>
    <text x="905" y="29" fill="#F97316" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ESCALA DE VENDAS</text>
  
      
      <!-- Top Budget Box -->
      <rect x="300" y="80" width="400" height="85" rx="10" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
      <text x="500" y="115" fill="#F97316" font-family="Sora" font-size="18" font-weight="800" text-anchor="middle">Orçamento de Campanha: R$ 300,00/dia</text>
      <text x="500" y="145" fill="#94A3B8" font-family="Inter" font-size="12" text-anchor="middle">A IA da Meta distribui automaticamente para o conjunto com menor CPA</text>

      <!-- Connectors with dynamic flow -->
      <path d="M 450 165 L 200 240" stroke="#10B981" stroke-width="6" fill="none"/>
      <path d="M 500 165 L 500 240" stroke="#38BDF8" stroke-width="3" fill="none"/>
      <path d="M 550 165 L 800 240" stroke="#64748B" stroke-width="1.5" fill="none"/>

      <!-- Set 1 (Best Performer) -->
      <rect x="70" y="240" width="260" height="170" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
      <text x="200" y="270" fill="#10B981" font-family="Sora" font-size="14" font-weight="700" text-anchor="middle">Conjunto Campeão (LAL 1%)</text>
      <rect x="90" y="290" width="220" height="35" rx="4" fill="#10B981" opacity="0.2"/>
      <text x="200" y="313" fill="#10B981" font-family="Sora" font-size="15" font-weight="800" text-anchor="middle">Recebe: R$ 195,00 (65%)</text>
      <text x="200" y="355" fill="#F8FAFC" font-family="Inter" font-size="12" text-anchor="middle">ROAS: 5.4x | 18 Vendas</text>
      <text x="200" y="385" fill="#38BDF8" font-family="Inter" font-size="11" font-weight="600" text-anchor="middle">&#9733; Foco Máximo da IA</text>

      <!-- Set 2 (Medium) -->
      <rect x="370" y="240" width="260" height="170" rx="8" fill="#0F172A" stroke="#38BDF8"/>
      <text x="500" y="270" fill="#38BDF8" font-family="Sora" font-size="14" font-weight="700" text-anchor="middle">Conjunto 2 (Engajamento)</text>
      <rect x="390" y="290" width="220" height="35" rx="4" fill="#0284C7" opacity="0.2"/>
      <text x="500" y="313" fill="#38BDF8" font-family="Sora" font-size="15" font-weight="800" text-anchor="middle">Recebe: R$ 75,00 (25%)</text>
      <text x="500" y="355" fill="#F8FAFC" font-family="Inter" font-size="12" text-anchor="middle">ROAS: 3.8x | 6 Vendas</text>
      <text x="500" y="385" fill="#94A3B8" font-family="Inter" font-size="11" text-anchor="middle">Volume Secundário</text>

      <!-- Set 3 (Low) -->
      <rect x="670" y="240" width="260" height="170" rx="8" fill="#0F172A" stroke="#64748B"/>
      <text x="800" y="270" fill="#94A3B8" font-family="Sora" font-size="14" font-weight="700" text-anchor="middle">Conjunto 3 (Lookalike 3%)</text>
      <rect x="690" y="290" width="220" height="35" rx="4" fill="#334155"/>
      <text x="800" y="313" fill="#94A3B8" font-family="Sora" font-size="15" font-weight="800" text-anchor="middle">Recebe: R$ 30,00 (10%)</text>
      <text x="800" y="355" fill="#F8FAFC" font-family="Inter" font-size="12" text-anchor="middle">ROAS: 2.5x | 2 Vendas</text>
      <text x="800" y="385" fill="#F59E0B" font-family="Inter" font-size="11" text-anchor="middle">Consumo Restrito</text>

      <rect x="70" y="440" width="860" height="60" rx="8" fill="#1E293B"/>
      <text x="100" y="475" fill="#F97316" font-family="Inter" font-size="13" font-weight="700">Resultado Geral da Campanha: R$ 300 investidos &rarr; R$ 1.380 faturados (ROAS Médio: 4.6x)</text>
    </svg>