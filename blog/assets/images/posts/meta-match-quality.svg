      <text x="200" y="215" fill="#F8FAFC" font-family="Sora" font-size="42" font-weight="800" text-anchor="middle">8.9</text>
      <text x="200" y="245" fill="#10B981" font-family="Inter" font-size="14" font-weight="700" text-anchor="middle">Excelente (0-10)</text>
      <text x="200" y="350" fill="#F8FAFC" font-family="Sora" font-size="16" font-weight="700" text-anchor="middle">Evento: Compra (Purchase)</text>
      <text x="200" y="375" fill="#94A3B8" font-family="Inter" font-size="12" text-anchor="middle">Últimos 7 dias de tráfego</text>
      <rect x="100" y="410" width="200" height="32" rx="16" fill="#10B981" opacity="0.2"/>
      <text x="200" y="431" fill="#10B981" font-family="Inter" font-size="12" font-weight="700" text-anchor="middle">&#10003; Correspondência Alta</text>

      <!-- Parameters Breakdown -->
      <rect x="380" y="80" width="570" height="440" rx="10" fill="#1E293B"/>
      <text x="410" y="120" fill="#F8FAFC" font-family="Sora" font-size="18" font-weight="700">Parâmetros de Usuário Enviados</text>
      
      <!-- Param Rows -->
      <rect x="410" y="145" width="510" height="45" rx="6" fill="#0F172A"/>
      <text x="430" y="172" fill="#F8FAFC" font-family="Inter" font-size="13" font-weight="600">E-mail (SHA-256)</text>
