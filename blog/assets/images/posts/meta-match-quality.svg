<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
      
    <rect width="100%" height="100%" fill="#111827" rx="14"/>
    <rect width="100%" height="48" fill="#1E293B" rx="14"/>
    <rect y="36" width="100%" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>
    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Diagnóstico de Event Match Quality (Meta Ads)</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#10B981" opacity="0.2"/>
    <text x="905" y="29" fill="#10B981" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STATUS: EXCELENTE</text>
  
      
      <!-- Score Circle Area -->
      <rect x="50" y="80" width="300" height="440" rx="10" fill="#1E293B"/>
      <circle cx="200" cy="220" r="90" fill="none" stroke="#334155" stroke-width="16"/>
