      <text x="750" y="392" fill="#10B981" font-family="Inter" font-size="13" font-weight="700">100% capturado</text>

      <rect x="410" y="420" width="510" height="45" rx="6" fill="#0F172A"/>
      <text x="430" y="447" fill="#F8FAFC" font-family="Inter" font-size="13" font-weight="600">Cidade, Estado e CEP (SHA-256)</text>
      <text x="750" y="447" fill="#10B981" font-family="Inter" font-size="13" font-weight="700">82% correspondido</text>
