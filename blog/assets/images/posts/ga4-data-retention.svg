<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
      
    <rect width="100%" height="100%" fill="#111827" rx="14"/>
    <rect width="100%" height="48" fill="#1E293B" rx="14"/>
    <rect y="36" width="100%" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>
    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Google Analytics 4 | Coleta e Modificação de Dados > Retenção de Dados</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#2563EB" opacity="0.2"/>
    <text x="905" y="29" fill="#2563EB" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CONFIGURAÇÃO GA4</text>
  
      
      <rect x="60" y="80" width="880" height="440" rx="10" fill="#1E293B"/>
      <text x="100" y="130" fill="#F8FAFC" font-family="Sora" font-size="20" font-weight="700">Retenção de Dados de Eventos e Usuários</text>
      <text x="100" y="160" fill="#94A3B8" font-family="Inter" font-size="13">Define por quanto tempo o GA4 mantém dados granulares para relatórios de Exploração.</text>

      <!-- Default vs Configured Comparison -->
      <rect x="100" y="195" width="380" height="170" rx="8" fill="#0F172A" stroke="#EF4444"/>
      <text x="125" y="230" fill="#EF4444" font-family="Sora" font-size="16" font-weight="700">&#10007; Configuração Padrão do Google</text>
      <text x="125" y="265" fill="#F8FAFC" font-family="Inter" font-size="24" font-weight="800">2 Meses</text>
      <text x="125" y="300" fill="#94A3B8" font-family="Inter" font-size="12">Apaga o histórico detalhado de navegação após 60 dias, impedindo comparações anuais.</text>

      <rect x="520" y="195" width="420" height="170" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
      <text x="545" y="230" fill="#10B981" font-family="Sora" font-size="16" font-weight="700">&#10003; Configuração Recomendada</text>
      <text x="545" y="265" fill="#10B981" font-family="Inter" font-size="24" font-weight="800">14 Meses (Máximo)</text>
      <text x="545" y="300" fill="#94A3B8" font-family="Inter" font-size="12">Permite analisar sazonalidade completa e retenção de clientes de longo prazo.</text>

      <rect x="100" y="400" width="840" height="70" rx="8" fill="#090D16"/>
      <text x="125" y="430" fill="#38BDF8" font-family="Inter" font-size="13" font-weight="700">Redefinir com novos dados a cada atividade do usuário: [ATIVADO]</text>
      <text x="125" y="452" fill="#94A3B8" font-family="Inter" font-size="11">Renova a contagem de 14 meses toda vez que o cliente faz uma nova visita ao site.</text>
    </svg>