    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Google Tag Manager | Instalação do Container no Código HTML</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#2563EB" opacity="0.2"/>
    <text x="905" y="29" fill="#2563EB" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CONTAINER GTM</text>
  
      
      <!-- Code Box Header -->
      <rect x="50" y="70" width="900" height="205" rx="8" fill="#090D16" stroke="#334155"/>
      <text x="75" y="100" fill="#38BDF8" font-family="Sora" font-size="13" font-weight="700">Cole este código o mais alto possível dentro da tag &lt;head&gt; do seu site:</text>
      <text x="75" y="130" fill="#F8FAFC" font-family="JetBrains Mono" font-size="11">&lt;script&gt;(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':</text>
      <text x="75" y="150" fill="#F8FAFC" font-family="JetBrains Mono" font-size="11">new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],</text>
      <text x="75" y="170" fill="#F8FAFC" font-family="JetBrains Mono" font-size="11">j=d.createElement(s),dl=l!='dataLayer'?'&amp;l='+l:'';j.async=true;j.src=</text>
      <text x="75" y="190" fill="#F8FAFC" font-family="JetBrains Mono" font-size="11">'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);</text>
      <text x="75" y="210" fill="#10B981" font-family="JetBrains Mono" font-size="11">})(window,document,'script','dataLayer','GTM-8K9X2P');&lt;/script&gt;</text>
      <text x="75" y="240" fill="#64748B" font-family="JetBrains Mono" font-size="11">&lt;!-- Fim do Google Tag Manager - Header --&gt;</text>

      <!-- Code Box Body -->
      <rect x="50" y="300" width="900" height="150" rx="8" fill="#090D16" stroke="#334155"/>
      <text x="75" y="330" fill="#F97316" font-family="Sora" font-size="13" font-weight="700">Cole este código imediatamente após a abertura da tag &lt;body&gt;:</text>
      <text x="75" y="360" fill="#F8FAFC" font-family="JetBrains Mono" font-size="11">&lt;noscript&gt;&lt;iframe src="https://www.googletagmanager.com/ns.html?id=GTM-8K9X2P"</text>
      <text x="75" y="380" fill="#F8FAFC" font-family="JetBrains Mono" font-size="11">height="0" width="0" style="display:none;visibility:hidden"&gt;&lt;/iframe&gt;&lt;/noscript&gt;</text>
      <text x="75" y="410" fill="#64748B" font-family="JetBrains Mono" font-size="11">&lt;!-- Fim do Google Tag Manager - NoScript Body --&gt;</text>

      <rect x="50" y="470" width="900" height="50" rx="8" fill="#1E293B"/>
      <text x="75" y="500" fill="#10B981" font-family="Inter" font-size="13" font-weight="600">&#10003; Uma única instalação do GTM gerencia Meta Pixel, Google Ads, GA4 e TikTok Ads sem mexer mais no código.</text>
