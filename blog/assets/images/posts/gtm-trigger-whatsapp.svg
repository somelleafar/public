<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
      
    <rect width="100%" height="100%" fill="#111827" rx="14"/>
    <rect width="100%" height="48" fill="#1E293B" rx="14"/>
    <rect y="36" width="100%" height="12" fill="#1E293B"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>
    <text x="100" y="29" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Google Tag Manager | Configuração de Acionador > Clique em WhatsApp</text>
    <rect x="840" y="14" width="130" height="22" rx="11" fill="#10B981" opacity="0.2"/>
    <text x="905" y="29" fill="#10B981" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ACIONADOR ATIVO</text>
  
      
      <!-- Trigger Config Card -->
      <rect x="60" y="80" width="880" height="440" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="90" y="125" fill="#F8FAFC" font-family="Sora" font-size="18" font-weight="700">Configuração do Acionador: [Clique no Botão de WhatsApp]</text>
      
      <!-- Type of Trigger -->
      <rect x="90" y="150" width="820" height="65" rx="6" fill="#0F172A"/>
      <text x="115" y="175" fill="#94A3B8" font-family="Inter" font-size="11" font-weight="700" text-transform="uppercase">Tipo de Acionador</text>
      <text x="115" y="200" fill="#38BDF8" font-family="Inter" font-size="15" font-weight="700">Cliques - Apenas Links (Click - Just Links)</text>

      <!-- Firing Conditions -->
      <rect x="90" y="235" width="820" height="190" rx="6" fill="#0F172A"/>
      <text x="115" y="265" fill="#94A3B8" font-family="Inter" font-size="11" font-weight="700" text-transform="uppercase">Este acionador é disparado em:</text>
      <text x="115" y="290" fill="#F8FAFC" font-family="Inter" font-size="14" font-weight="600">&#9673; Alguns cliques em links</text>

      <!-- Rules Filter -->
      <rect x="115" y="315" width="220" height="42" rx="4" fill="#1E293B"/>
      <text x="135" y="341" fill="#F8FAFC" font-family="JetBrains Mono" font-size="13">Click URL</text>
      
      <rect x="350" y="315" width="180" height="42" rx="4" fill="#1E293B"/>
      <text x="370" y="341" fill="#F8FAFC" font-family="Inter" font-size="13">contém</text>

      <rect x="545" y="315" width="340" height="42" rx="4" fill="#090D16" stroke="#10B981"/>
      <text x="565" y="341" fill="#10B981" font-family="JetBrains Mono" font-size="13">wa.me</text>

      <text x="115" y="395" fill="#94A3B8" font-family="Inter" font-size="12">Também dispara para URLs com: "api.whatsapp.com" ou "chat.whatsapp.com"</text>

      <rect x="90" y="445" width="820" height="50" rx="6" fill="#2563EB" opacity="0.15"/>
      <text x="115" y="475" fill="#38BDF8" font-family="Inter" font-size="12" font-weight="700">&#10003; Vinculado às tags: "Meta Ads - Lead WhatsApp" e "Google Ads - Conversão WhatsApp"</text>
    </svg>